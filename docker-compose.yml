services:
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - order-service
      - user-service
      - payment-service
      - inventory-service

  frontend:
    build: ./frontend
    environment:
      SERVICE_NAME: frontend
      ENVIRONMENT: local
      AWS_DEPLOYMENT_TYPE: docker-compose
      VERSION: "1.0.0"

  order-service:
    build:
      context: ./services
      dockerfile: order-service/Dockerfile
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: local
      AWS_DEPLOYMENT_TYPE: docker-compose
      VERSION: "1.0.0"
      USER_SERVICE_URL: http://user-service:5000/profile

  user-service:
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    environment:
      SERVICE_NAME: user-service
      ENVIRONMENT: local
      AWS_DEPLOYMENT_TYPE: docker-compose
      VERSION: "1.0.0"

  payment-service:
    build:
      context: ./services
      dockerfile: payment-service/Dockerfile
    environment:
      SERVICE_NAME: payment-service
      ENVIRONMENT: local
      AWS_DEPLOYMENT_TYPE: docker-compose
      VERSION: "1.0.0"
      INVENTORY_SERVICE_URL: http://inventory-service:5000/check

  inventory-service:
    build:
      context: ./services
      dockerfile: inventory-service/Dockerfile
    environment:
      SERVICE_NAME: inventory-service
      ENVIRONMENT: local
      AWS_DEPLOYMENT_TYPE: docker-compose
      VERSION: "1.0.0"
