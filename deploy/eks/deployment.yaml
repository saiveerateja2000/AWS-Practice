apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloud-native-traffic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: <account>.dkr.ecr.<region>.amazonaws.com/order-service:v1.0.0
          ports:
            - containerPort: 5000
          env:
            - name: SERVICE_NAME
              value: order-service
            - name: ENVIRONMENT
              value: eks
            - name: AWS_DEPLOYMENT_TYPE
              value: EKS
            - name: VERSION
              value: "1.0.0"
---
