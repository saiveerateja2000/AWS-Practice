<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traffic Dashboard</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="container"><h1>Traffic Dashboard</h1><div class="card"><pre id="out">Loading...</pre></div><a href="/">Back</a></div><script src="/static/app.js"></script><script>
(async()=>{
  const mapping={'Order Service Requests':'/orders/metrics','User Service Requests':'/users/metrics','Payment Service Requests':'/payments/metrics','Inventory Service Requests':'/inventory/metrics'};
  const result={};
  for (const [label,url] of Object.entries(mapping)){ const v=await fetchJson(url); result[label]=v.data.request_count; }
  renderJson('out', result);
})();
</script></body></html>
